<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140d04" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BEEBALL 47</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>" />
  </head>
  <body>
    <div id="hud">
      <div class="stat"><span class="ic">🍯</span><span id="honey">0</span></div>
      <div class="stat"><span class="ic">🐝</span><span id="bees">0</span></div>
    </div>
    <div id="hud-r">
      <div id="wave">WAVE 1</div>
      <div class="hp"><div id="hpfill"></div></div>
    </div>
    <div id="chain"></div>
    <div id="banner"></div>
    <div id="slots-hud" class="slots"></div>
    <div id="hint" data-i18n="hint"></div>
    <div id="shop" hidden>
      <div class="shop-box">
        <div class="shop-head">
          <h2 id="shop-title"></h2>
          <div id="shop-sub"></div>
        </div>
        <div id="cards"></div>
        <div id="shop-msg"></div>
        <div id="slots" class="slots"></div>
        <div id="traits"></div>
        <div class="shop-row">
          <button id="reroll" class="ghost"></button>
          <button id="repair" class="ghost"></button>
          <button id="next" data-i18n="shop.next"></button>
        </div>
      </div>
    </div>
    <div id="over" hidden>
      <div class="box">
        <h1 data-i18n="over.title"></h1>
        <p id="over-stats"></p>
        <div class="over-row">
          <button id="restart" data-i18n="over.retry"></button>
          <button id="to-menu" class="ghost" data-i18n="over.menu"></button>
        </div>
      </div>
    </div>
    <div id="menu">
      <div class="menu-box">
        <div class="logo">BEEBALL<span>47</span></div>
        <p class="tag" data-i18n="menu.tag"></p>
        <button id="start" data-i18n="menu.start"></button>
        <div class="menu-row">
          <button id="open-codex" class="ghost" data-i18n="menu.codex"></button>
          <button id="open-settings" class="ghost" data-i18n="menu.settings"></button>
        </div>
        <p id="best"></p>
      </div>
    </div>
    <div id="codex" class="panel" hidden>
      <div class="panel-box">
        <h2 data-i18n="codex.title"></h2>
        <div class="how" data-i18n-html="codex.how"></div>
        <div id="codex-list"></div>
        <div class="panel-row"><button class="close" data-i18n="close"></button></div>
      </div>
    </div>
    <div id="settings" class="panel" hidden>
      <div class="panel-box">
        <h2 data-i18n="settings.title"></h2>
        <label class="opt"><span data-i18n="settings.lang"></span><select id="opt-lang"></select></label>
        <label class="opt"><span data-i18n="settings.music"></span><input id="opt-music" type="range" min="0" max="100" step="5"><span id="opt-music-v"></span></label>
        <label class="opt"><span data-i18n="settings.volume"></span><input id="opt-volume" type="range" min="0" max="100" step="5"><span id="opt-volume-v"></span></label>
        <label class="opt"><span data-i18n="settings.buzz"></span><input id="opt-buzz" type="checkbox"></label>
        <label class="opt"><span data-i18n="settings.shake"></span><input id="opt-shake" type="checkbox"></label>
        <label class="opt"><span data-i18n="settings.lite"></span><small data-i18n="settings.liteHint"></small><input id="opt-lite" type="checkbox"></label>
        <label class="opt"><span data-i18n="settings.demo"></span><input id="opt-demo" type="checkbox"></label>
        <div class="panel-row"><button class="close" data-i18n="close"></button></div>
      </div>
    </div>
    <div id="pause" class="panel" hidden>
      <div class="panel-box">
        <h2 data-i18n="pause.title"></h2>
        <div class="panel-col">
          <button id="resume" data-i18n="pause.resume"></button>
          <button id="pause-settings" class="ghost" data-i18n="pause.settings"></button>
          <button id="pause-menu" class="ghost" data-i18n="pause.menu"></button>
        </div>
      </div>
    </div>
    <button id="gear" data-i18n-tip="pause.button">⏸</button>
    <div id="secret"></div>
    <div id="tip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
